<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #1a1a2e; }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 28px; }
  .header-title h1 { color: #fff; font-size: 22px; font-weight: 700; }
  .header-title p { color: #a0aec0; font-size: 13px; margin-top: 2px; }
  .header-badge {
    background: #e94560; color: #fff;
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }

  /* ===== MONTH TABS ===== */
  .month-nav { background: #fff; border-bottom: 2px solid #e2e8f0; padding: 0 32px; }
  .month-tabs { display: flex; gap: 0; overflow-x: auto; }
  .month-tab {
    padding: 14px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; background: none; color: #718096;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.2s; white-space: nowrap;
  }
  .month-tab:hover { color: #0f3460; }
  .month-tab.active { color: #0f3460; border-bottom-color: #e94560; }
  .month-tab.add-month {
    color: #a0aec0; border: 2px dashed #e2e8f0; border-radius: 8px;
    margin: 8px 0; padding: 6px 16px; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .month-tab.add-month:hover { border-color: #0f3460; color: #0f3460; background: #f7fafc; }

  /* ===== MAIN CONTENT ===== */
  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .section-title {
    font-size: 16px; font-weight: 700; color: #2d3748;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px; background: #e2e8f0;
  }

  /* ===== KPI CARDS ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-card {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-left: 4px solid #e2e8f0;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
  .kpi-card.shopee { border-left-color: #ee4d2d; }
  .kpi-card.lazada { border-left-color: #0f146b; }
  .kpi-card.facebook { border-left-color: #1877f2; }
  .kpi-card.combined { border-left-color: #38a169; }
  .kpi-label { font-size: 12px; color: #718096; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-platform { font-size: 11px; margin-bottom: 8px; }
  .kpi-platform.shopee { color: #ee4d2d; }
  .kpi-platform.lazada { color: #0f146b; }
  .kpi-platform.facebook { color: #1877f2; }
  .kpi-platform.combined { color: #38a169; }
  .kpi-value { font-size: 26px; font-weight: 800; color: #1a1a2e; line-height: 1.2; }
  .kpi-sub { font-size: 12px; color: #718096; margin-top: 4px; }
  .badge-up { color: #38a169; font-weight: 700; }
  .badge-down { color: #e53e3e; font-weight: 700; }

  /* ===== PLATFORM ROW ===== */
  .platform-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .platform-section {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .platform-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;
  }
  .platform-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .platform-icon.shopee { background: #fff3f0; }
  .platform-icon.lazada { background: #f0f2ff; }
  .platform-name { font-size: 16px; font-weight: 700; }
  .platform-period { font-size: 12px; color: #718096; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .metric-item { text-align: center; padding: 10px; background: #f7fafc; border-radius: 10px; }
  .metric-item-label { font-size: 11px; color: #718096; margin-bottom: 4px; }
  .metric-item-value { font-size: 17px; font-weight: 700; color: #1a1a2e; }

  /* ===== CHARTS ===== */
  .chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 28px; }
  .chart-box {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .chart-box.full { grid-column: 1 / -1; }
  .chart-title { font-size: 14px; font-weight: 700; color: #2d3748; margin-bottom: 16px; }
  .chart-wrap { position: relative; }

  /* ===== FACEBOOK SECTION ===== */
  .fb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .fb-card {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-top: 3px solid #1877f2;
  }
  .fb-card-label { font-size: 12px; color: #718096; margin-bottom: 6px; font-weight: 600; }
  .fb-card-value { font-size: 24px; font-weight: 800; color: #1a1a2e; }
  .fb-card-change { font-size: 12px; margin-top: 4px; }

  /* ===== FUNNEL ===== */
  .funnel-row { display: flex; align-items: center; gap: 0; margin-bottom: 20px; }
  .funnel-step {
    flex: 1; background: #fff; border-radius: 14px; padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;
    border-top: 3px solid;
  }
  .funnel-step:nth-child(1) { border-top-color: #1877f2; }
  .funnel-step:nth-child(3) { border-top-color: #38a169; }
  .funnel-step:nth-child(5) { border-top-color: #f6ad55; }
  .funnel-step:nth-child(7) { border-top-color: #e94560; }
  .funnel-arrow {
    font-size: 20px; color: #cbd5e0; padding: 0 8px;
    display: flex; flex-direction: column; align-items: center;
  }
  .funnel-rate { font-size: 11px; color: #718096; }
  .funnel-label { font-size: 12px; color: #718096; margin-bottom: 4px; }
  .funnel-value { font-size: 22px; font-weight: 800; color: #1a1a2e; }

  /* ===== DAILY TABLE ===== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f7fafc; padding: 10px 12px; text-align: left;
    font-weight: 700; color: #4a5568; border-bottom: 2px solid #e2e8f0;
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
  tbody tr:hover { background: #f7fafc; }
  tbody td { padding: 9px 12px; color: #2d3748; }
  .td-num { text-align: right; }
  .bar-inline {
    display: inline-block; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #ee4d2d, #ff8c6b);
    vertical-align: middle; margin-right: 6px;
  }
  .bar-inline.lz { background: linear-gradient(90deg, #0f146b, #4a52d9); }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center; padding: 20px; color: #a0aec0; font-size: 12px;
    border-top: 1px solid #e2e8f0; margin-top: 8px;
  }

  /* ===== SHOPEE PRODUCT SECTION ===== */
  .source-summary-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
  }
  .source-card {
    background: #fff; border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-top: 3px solid #ee4d2d;
    display: flex; flex-direction: column; gap: 4px;
  }
  .source-card.live { border-top-color: #e53e3e; }
  .source-card.video { border-top-color: #805ad5; }
  .source-card.partner { border-top-color: #38a169; }
  .source-card.ads { border-top-color: #f6ad55; }
  .source-card-label { font-size: 12px; color: #718096; font-weight: 600; }
  .source-card-value { font-size: 20px; font-weight: 800; color: #1a1a2e; }
  .source-card-pct { font-size: 12px; color: #a0aec0; }

  .product-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .product-tab {
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 2px solid #e2e8f0; background: #fff; color: #718096;
    transition: all 0.2s;
  }
  .product-tab:hover { border-color: #ee4d2d; color: #ee4d2d; }
  .product-tab.active { background: #ee4d2d; color: #fff; border-color: #ee4d2d; }
  .product-tab.live.active { background: #e53e3e; border-color: #e53e3e; }
  .product-tab.video.active { background: #805ad5; border-color: #805ad5; }
  .product-tab.partner.active { background: #38a169; border-color: #38a169; }

  .product-table-wrap { overflow-x: auto; }
  .product-section { display: none; }
  .product-section.active { display: block; }

  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; font-size: 11px; font-weight: 700;
    background: #f7fafc; color: #4a5568;
  }
  .rank-badge.gold { background: #fef3c7; color: #b45309; }
  .rank-badge.silver { background: #f1f5f9; color: #475569; }
  .rank-badge.bronze { background: #fef7ed; color: #c2410c; }

  .product-name-cell { max-width: 300px; }
  .product-name-short { font-weight: 600; font-size: 13px; color: #1a1a2e; }
  .product-id { font-size: 11px; color: #a0aec0; margin-top: 2px; }

  .pct-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .pct-bar-bg {
    flex: 1; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden;
    min-width: 60px;
  }
  .pct-bar-fill { height: 100%; border-radius: 4px; background: #ee4d2d; }
  .pct-bar-fill.video { background: #805ad5; }
  .pct-bar-fill.partner { background: #38a169; }

  .no-data {
    text-align: center; padding: 60px 20px; color: #a0aec0;
  }
  .no-data .icon { font-size: 48px; margin-bottom: 12px; }
  .no-data p { font-size: 15px; margin-bottom: 6px; }
  .no-data small { font-size: 13px; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .platform-row { grid-template-columns: 1fr; }
    .chart-row { grid-template-columns: 1fr; }
    .fb-grid { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 16px; }
  }
</style>
</head>

// ============================================================
// UTILITIES
// ============================================================
function fmt(n, decimals=0) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('th-TH', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
}
function changeHtml(val, suffix='%') {
  if (val === null || val === undefined) return '';
  const cls = val >= 0 ? 'badge-up' : 'badge-down';
  const sign = val >= 0 ? '▲' : '▼';
  return `<span class="${cls}">${sign} ${Math.abs(val).toFixed(1)}${suffix}</span>`;
}

let charts = {};
function destroyCharts() {
  Object.values(charts).forEach(c => { if(c) c.destroy(); });
  charts = {};
}

// ============================================================
// PRODUCT TABLE HELPER
// ============================================================
function renderProductTable(products, type) {
  const rankClass = ['gold','silver','bronze','',''];
  const fillClass = type === 'video' ? 'video' : type === 'partner' ? 'partner' : '';
  const maxPct = Math.max(...products.map(p => parseFloat(p.pct)));
  return `
    <table>
      <thead>
        <tr>
          <th style="width:32px">#</th>
          <th>ชื่อสินค้า</th>
          <th class="td-num">สัดส่วน</th>
          <th class="td-num">ยอดขาย (฿)</th>
          <th class="td-num">คลิก</th>
          <th class="td-num">คำสั่งซื้อ</th>
          <th class="td-num">CTR</th>
          <th class="td-num">Conv.</th>
          <th class="td-num">ยอดขายเฉลี่ย (฿)</th>
          <th class="td-num">ผู้ซื้อ</th>
        </tr>
      </thead>
      <tbody>
        ${products.map((p, i) => `
          <tr>
            <td><span class="rank-badge ${rankClass[i]}">${i+1}</span></td>
            <td class="product-name-cell">
              <div class="product-name-short">${p.name}</div>
              <div class="product-id">ID: ${p.id}</div>
            </td>
            <td class="td-num">
              <div class="pct-bar-wrap">
                <div class="pct-bar-bg">
                  <div class="pct-bar-fill ${fillClass}" style="width:${(parseFloat(p.pct)/maxPct*100).toFixed(0)}%"></div>
                </div>
                <span style="font-weight:700;color:#1a1a2e;min-width:42px">${p.pct}</span>
              </div>
            </td>
            <td class="td-num"><b>${p.sales}</b></td>
            <td class="td-num">${fmt(p.clicks)}</td>
            <td class="td-num">${typeof p.orders === 'number' ? p.orders.toFixed(0) : p.orders}</td>
            <td class="td-num">${p.ctr}</td>
            <td class="td-num">${p.cvr}</td>
            <td class="td-num">${p.avgOrder}</td>
            <td class="td-num">${p.buyers}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function switchProductTab(name, btn) {
  document.querySelectorAll('.product-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.product-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('ptab-' + name).classList.add('active');
  btn.classList.add('active');
}

function renderTabs(activeKey) {
  const container = document.getElementById('monthTabs');
  const keys = Object.keys(ALL_DATA).sort().reverse();
  container.innerHTML = keys.map(k => `
    <button class="month-tab ${k === activeKey ? 'active' : ''}"
            onclick="switchMonth('${k}')">
      ${ALL_DATA[k].label}
    </button>
  `).join('') + `
    <button class="month-tab add-month" onclick="showAddMonthHint()">
      ＋ เพิ่มเดือน
    </button>
  `;
}

// ============================================================
// CHARTS
// ============================================================
function drawCharts(d) {
  const labels = d.shopee.daily.map(r => r.d);
  const spSales = d.shopee.daily.map(r => r.s);
  const lzSales = d.lazada.daily.map(r => r.s);
  const spOrders = d.shopee.daily.map(r => r.o);
  const lzOrders = d.lazada.daily.map(r => r.o);
  const spVisitors = d.shopee.daily.map(r => r.v);
  const lzVisitors = d.lazada.daily.map(r => r.v);

  // Sales line chart
  const ctxSales = document.getElementById('chartSales');
  if (ctxSales) {
    charts.sales = new Chart(ctxSales, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Shopee (฿)',
            data: spSales,
            borderColor: '#ee4d2d',
            backgroundColor: 'rgba(238,77,45,0.08)',
            borderWidth: 2.5,
            pointRadius: 3,
            tension: 0.3,
            fill: true,
          },
          {
            label: 'Lazada (฿)',
            data: lzSales,
            borderColor: '#0f146b',
            backgroundColor: 'rgba(15,20,107,0.06)',
            borderWidth: 2.5,
            pointRadius: 3,
            tension: 0.3,
            fill: true,
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Segoe UI' } } },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ฿${ctx.parsed.y.toLocaleString('th-TH')}`
            }
          }
        },
        scales: {
          y: {
            grid: { color: '#f0f0f0' },
            ticks: {
              callback: v => '฿' + (v >= 1000 ? (v/1000).toFixed(0)+'K' : v)
            }
          },
          x: { grid: { display: false }, ticks: { maxTicksLimit: 16 } }
        }
      }
    });
  }

  // Pie chart
  const ctxPie = document.getElementById('chartPie');
  if (ctxPie) {
    const spTotal = d.shopee.summary.totalSales;
    const lzTotal = d.lazada.summary.totalSales;
    charts.pie = new Chart(ctxPie, {
      type: 'doughnut',
      data: {
        labels: ['Shopee', 'Lazada'],
        datasets: [{
          data: [spTotal, lzTotal],
          backgroundColor: ['#ee4d2d', '#0f146b'],
          borderWidth: 3,
          borderColor: '#fff',
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom' },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.label}: ฿${ctx.parsed.toLocaleString('th-TH')} (${(ctx.parsed/(spTotal+lzTotal)*100).toFixed(1)}%)`
            }
          }
        }
      }
    });
  }

  // Orders bar chart
  const ctxOrders = document.getElementById('chartOrders');
  if (ctxOrders) {
    charts.orders = new Chart(ctxOrders, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: 'Shopee',
            data: spOrders,
            backgroundColor: 'rgba(238,77,45,0.75)',
            borderRadius: 4,
          },
          {
            label: 'Lazada',
            data: lzOrders,
            backgroundColor: 'rgba(15,20,107,0.70)',
            borderRadius: 4,
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top' } },
        scales: {
          x: { stacked: false, grid: { display: false }, ticks: { maxTicksLimit: 16 } },
          y: { grid: { color: '#f0f0f0' } }
        }
      }
    });
  }

  // Source pie chart
  const ctxSourcePie = document.getElementById('chartSourcePie');
  if (ctxSourcePie && d.shopeeProductShare) {
    const ps = d.shopeeProductShare.summary;
    charts.sourcePie = new Chart(ctxSourcePie, {
      type: 'doughnut',
      data: {
        labels: ['หน้ารายละเอียดสินค้า', 'วิดีโอของร้านค้า', 'พาร์ทเนอร์', 'Shopee Ads', 'Live'],
        datasets: [{
          data: [ps.detail, ps.video, ps.partner, ps.ads, ps.live],
          backgroundColor: ['#ee4d2d', '#805ad5', '#38a169', '#f6ad55', '#e53e3e'],
          borderWidth: 3, borderColor: '#fff',
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 12 }, boxWidth: 14 } },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.label}: ฿${ctx.parsed.toLocaleString('th-TH')} (${(ctx.parsed/ps.total*100).toFixed(1)}%)`
            }
          }
        }
      }
    });
  }

  // Top products bar chart
  const ctxTopProducts = document.getElementById('chartTopProducts');
  if (ctxTopProducts && d.shopeeProductShare) {
    const prods = d.shopeeProductShare.detail;
    const shortNames = prods.map(p => p.name.length > 28 ? p.name.substring(0,28)+'…' : p.name);
    charts.topProducts = new Chart(ctxTopProducts, {
      type: 'bar',
      data: {
        labels: shortNames,
        datasets: [{
          label: 'ยอดขาย (฿)',
          data: prods.map(p => parseInt(p.sales.replace(/,/g,''))),
          backgroundColor: ['#ee4d2d','#f6ad55','#68d391','#4299e1','#b794f4'],
          borderRadius: 6,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ฿${ctx.parsed.x.toLocaleString('th-TH')} (${prods[ctx.dataIndex].pct})`
            }
          }
        },
        scales: {
          x: {
            grid: { color: '#f0f0f0' },
            ticks: { callback: v => '฿'+(v>=1000?(v/1000).toFixed(0)+'K':v) }
          },
          y: { grid: { display: false }, ticks: { font: { size: 11 } } }
        }
      }
    });
  }

  // Visitors line chart
  const ctxVisitors = document.getElementById('chartVisitors');
  if (ctxVisitors) {
    charts.visitors = new Chart(ctxVisitors, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Shopee',
            data: spVisitors,
            borderColor: '#ee4d2d',
            backgroundColor: 'rgba(238,77,45,0.08)',
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.3,
            fill: true,
          },
          {
            label: 'Lazada',
            data: lzVisitors,
            borderColor: '#0f146b',
            backgroundColor: 'rgba(15,20,107,0.06)',
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.3,
            fill: true,
          }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top' } },
        scales: {
          y: { grid: { color: '#f0f0f0' } },
          x: { grid: { display: false }, ticks: { maxTicksLimit: 16 } }
        }
      }
    });
  }
}

let currentKey = null;
function switchMonth(key) {
  if (!ALL_DATA[key]) return;
  currentKey = key;
  renderTabs(key);
  renderMain(key);
}

}
